[project]
name = "data-ingestion"
version = "0.1.3"
description = ""
authors = [{ name = "TransitMatters Labs Team" }]
requires-python = ">=3.14,<3.15"
license = "MIT"
dependencies = [
    "requests>=2.34.2,<3",
    "pytz>=2026.1,<2027",
    "boto3~=1.43",
    "numpy~=2.5",
    "pandas~=3.0",
    "geopy>=2.4.1,<3",
    "python-dotenv>=1.2.3,<2",
    "mbta-gtfs-sqlite>=1.2.0,<2",
    "openpyxl>=3.1.5,<4",
    "dynamodb-json>=1.4.2,<2",
    "datadog_lambda~=8.129.0",
    "tqdm>=4.67.1,<5",
    "click>=8.5.0,<9",
    "tzdata>=2026.1",
    "botocore[crt]",
]

[dependency-groups]
dev = [
    "chalice~=1.34.0",
    "ruff>=0.16.7",
    "pytest~=9.1.1",
    "pre-commit>=4.4.0",
    "pytest-cov>=7.0.0",
    "moto[dynamodb]>=5",
    "botocore[crt]",
]
docs = [
    "mkdocs-material>=9.7",
    "mkdocstrings[python]>=0.27",
    "mkdocs-include-markdown-plugin>=7.2.1",
]

[tool.pytest.ini_options]
addopts = "--cov=ingestor/chalicelib --cov-report=term-missing"
testpaths = ["ingestor/chalicelib/tests"]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
