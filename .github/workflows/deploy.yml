name: deploy

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *' # Runs at 00:00 on the first day of every month
  push:
    branches:
      - main

# Serialize deploys: CloudFormation rejects a change set while the stack is
# UPDATE_IN_PROGRESS, which silently drops the later of two close merges.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04-arm
    env:
      AWS_PROFILE: transitmatters
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      MBTA_V3_API_KEY: ${{ secrets.MBTA_V3_API_KEY }}
      DD_API_KEY: ${{ secrets.DD_API_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Set up Python via mise
        uses: jdx/mise-action@v5
      - name: Generate AWS profile
        run: |
          mkdir ~/.aws
          cat >> ~/.aws/credentials << EOF
          [$AWS_PROFILE]
          aws_access_key_id = $AWS_ACCESS_KEY_ID
          aws_secret_access_key = $AWS_SECRET_ACCESS_KEY
          EOF
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
      - name: Install dependencies
        run: uv sync --group dev
      - name: Run deploy shell script
        run: |
          bash devops/deploy.sh
